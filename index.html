<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor de película</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      background: #000;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at center, #111b35 0%, #070b18 48%, #020308 100%);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(18px, 4vw, 42px);
      width: min(100%, 840px);
    }

    .movie-card {
      display: block;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      appearance: none;
      transition: transform 220ms ease, filter 220ms ease;
    }

    .movie-card:hover,
    .movie-card:focus-visible {
      transform: translateY(-8px) scale(1.02);
      filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.65));
      outline: none;
    }

    .movie-card:focus-visible img {
      outline: 2px solid #e31b23;
      outline-offset: 6px;
    }

    .movie-poster {
      display: block;
      width: 100%;
      height: clamp(260px, 58vh, 560px);
      object-fit: contain;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.65));
    }

    .start-screen[hidden] {
      display: none;
    }

    video[hidden] {
      display: none;
    }

    @media (max-width: 700px) {
      .start-screen {
        padding: 16px;
      }

      .movie-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .movie-poster {
        height: 42vh;
      }
    }

  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <div class="movie-grid">
      <button class="movie-card" type="button" data-video="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" aria-label="Reproducir Spider-Man: Un Nuevo Día">
        <img class="movie-poster" src="https://m.media-amazon.com/images/S/pv-target-images/f7d270229dde123ea3b76f0fc91fb064b2330c97a9f757096618469b5a52118e.jpg" alt="Portada de Spider-Man: Un Nuevo Día">
      </button>
      <button class="movie-card" type="button" data-video="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/elfinaldelacalleoak.mp4" aria-label="Reproducir El final de la calle Oak">
        <img class="movie-poster" src="https://es.web.img3.acsta.net/img/61/97/61972d89c1722f4cfaa0301723e7db88.png" alt="Portada de El final de la calle Oak">
      </button>
      <button class="movie-card" type="button" data-video="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/animalespeligrosos.mp4" aria-label="Reproducir Animales peligrosos">
        <img class="movie-poster" src="https://m.media-amazon.com/images/S/pv-target-images/5e3420549474fc216e4d6348060270f1ce9df009df3b5d8a9c4d4ce6e05f4ac2.png" alt="Portada de Animales peligrosos">
      </button>
    </div>
  </div>

  <video id="movie" controls playsinline preload="metadata" hidden>
    <source src="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video HTML5.
  </video>

  <script>
    const movie = document.getElementById('movie');
    const startScreen = document.getElementById('startScreen');
    const movieCards = document.querySelectorAll('.movie-card');
    let lastTap = 0;

    function enableAudio() {
      movie.muted = false;
      movie.volume = 1;
    }

    function enterFullscreen() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || movie.webkitDisplayingFullscreen;
      if (isFullscreen) {
        return;
      }

      if (movie.requestFullscreen) {
        movie.requestFullscreen();
      } else if (movie.webkitEnterFullscreen) {
        movie.webkitEnterFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (movie.webkitDisplayingFullscreen && movie.webkitExitFullscreen) {
        movie.webkitExitFullscreen();
      }
    }

    function playMovie(videoUrl) {
      enableAudio();
      movie.src = videoUrl;
      movie.hidden = false;
      startScreen.hidden = true;
      movie.load();
      movie.play().catch(() => {
        exitFullscreen();
        movie.hidden = true;
        startScreen.hidden = false;
      });
      enterFullscreen();
    }

    movie.addEventListener('error', () => {
      exitFullscreen();
      movie.hidden = true;
      startScreen.hidden = false;
    });

    movieCards.forEach((card) => {
      card.addEventListener('click', () => {
        playMovie(card.dataset.video);
      });
    });

    movie.addEventListener('dblclick', enterFullscreen);
    movie.addEventListener('pointerup', enableAudio, { once: true });
    movie.addEventListener('click', enableAudio, { once: true });
    movie.addEventListener('pointerup', (event) => {
      if (event.pointerType === 'touch') {
        const now = Date.now();
        if (now - lastTap < 350) {
          enterFullscreen();
        }
        lastTap = now;
      }
    });
  </script>
</body>
</html>
