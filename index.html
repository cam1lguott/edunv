<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor de película</title>
  <style>
    :root {
      background: #000;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

  </style>
</head>
<body>
  <video id="movie" controls playsinline preload="metadata">
    <source src="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video HTML5.
  </video>

  <script>
    const movie = document.getElementById('movie');
    let lastTap = 0;

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (movie.requestFullscreen) {
        movie.requestFullscreen();
      } else if (movie.webkitEnterFullscreen) {
        movie.webkitEnterFullscreen();
      }
    }

    movie.addEventListener('dblclick', toggleFullscreen);
    movie.addEventListener('pointerup', (event) => {
      if (event.pointerType === 'touch') {
        const now = Date.now();
        if (now - lastTap < 350) {
          toggleFullscreen();
        }
        lastTap = now;
      }
    });
  </script>
</body>
</html>
