<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PEL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      background: #000;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: #000;
    }

    body {
      min-height: 100dvh;
      color: #fff;
      font-family: "DM Sans", sans-serif;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .start-screen {
      position: relative;
      z-index: 5;
      display: grid;
      min-height: 100dvh;
      width: 100%;
      place-items: center;
      padding: clamp(24px, 5vw, 64px) clamp(12px, 4vw, 48px);
      background:
        linear-gradient(180deg, rgba(20, 20, 20, 0.3), #050505 86%),
        radial-gradient(circle at top center, #241015 0%, #0d0d0d 48%, #050505 100%);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(14px, 2.8vw, 32px);
      width: min(100%, 1180px);
      margin: 0 auto;
    }

    .movie-card {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      appearance: none;
      color: #fff;
      text-align: left;
      transition: transform 220ms ease, filter 220ms ease;
    }

    .movie-card:hover,
    .movie-card:focus-visible {
      transform: translateY(-8px) scale(1.02);
      filter: drop-shadow(0 16px 22px rgba(0, 0, 0, 0.65));
      outline: none;
    }

    .movie-card:focus-visible img {
      outline: 2px solid #e31b23;
      outline-offset: 6px;
    }

    .movie-poster {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      height: auto;
      object-fit: contain;
      border-radius: 5px;
      background: #05070d;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.65));
    }

    .movie-title {
      display: block;
      margin-top: 10px;
      color: #fff;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(18px, 2vw, 24px);
      letter-spacing: 0.5px;
      line-height: 1;
    }

    .start-screen[hidden] {
      display: none;
    }

    video[hidden] {
      display: none;
    }

    @media (max-width: 900px) {
      .movie-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        max-width: 700px;
      }
    }

    @media (max-width: 700px) {
      .start-screen {
        place-items: start center;
        padding: 24px 14px 36px;
      }

      .movie-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px 12px;
        margin: 0 auto;
      }
    }

    @media (max-width: 340px) {
      .movie-grid {
        grid-template-columns: 1fr;
        width: min(100%, 220px);
      }
    }

  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <div class="movie-grid">
      <button class="movie-card" type="button" data-video="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" aria-label="Reproducir Spider-Man: Un Nuevo Día">
        <img class="movie-poster" src="https://m.media-amazon.com/images/S/pv-target-images/f7d270229dde123ea3b76f0fc91fb064b2330c97a9f757096618469b5a52118e.jpg" alt="Portada de Spider-Man: Un Nuevo Día">
        <span class="movie-title">Spider-Man: Un Nuevo Día</span>
      </button>
      <button class="movie-card" type="button" data-video="https://pub-01d2cf0892304b5193e3accbb6982358.r2.dev/finalcalleoak_final.mp4" aria-label="Reproducir El final de la calle Oak">
        <img class="movie-poster" src="https://es.web.img3.acsta.net/img/61/97/61972d89c1722f4cfaa0301723e7db88.png" alt="Portada de El final de la calle Oak">
        <span class="movie-title">El final de la calle Oak</span>
      </button>
      <button class="movie-card" type="button" data-video="https://pub-01d2cf0892304b5193e3accbb6982358.r2.dev/losanimalespeligrosos.mp4" aria-label="Reproducir Animales peligrosos">
        <img class="movie-poster" src="https://m.media-amazon.com/images/S/pv-target-images/5e3420549474fc216e4d6348060270f1ce9df009df3b5d8a9c4d4ce6e05f4ac2.png" alt="Portada de Animales peligrosos">
        <span class="movie-title">Animales peligrosos</span>
      </button>
      <button class="movie-card" type="button" data-video="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/peninsula.mp4" aria-label="Reproducir Península">
        <img class="movie-poster" src="https://m.media-amazon.com/images/M/MV5BYTFjN2E4ODQtMzAzMS00ZWFkLWE5Y2UtNWZjMTNkMGYzZGNmXkEyXkFqcGc@._V1_.jpg" alt="Portada de Península">
        <span class="movie-title">Península</span>
      </button>
      <button class="movie-card" type="button" data-video="https://pub-01d2cf0892304b5193e3accbb6982358.r2.dev/losamosdeluniv_final.mp4" aria-label="Reproducir Amos del Universo">
        <img class="movie-poster" src="https://m.media-amazon.com/images/M/MV5BZjBmODIxYzAtNWQ4My00Y2E3LWFjNzktMTE0NTE4NDE2OTYzXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg" alt="Portada de Amos del Universo">
        <span class="movie-title">Amos del Universo</span>
      </button>
      <button class="movie-card" type="button" data-video="https://pub-01d2cf0892304b5193e3accbb6982358.r2.dev/supergirl_final.mp4" aria-label="Reproducir Supergirl">
        <img class="movie-poster" src="https://m.media-amazon.com/images/S/pv-target-images/d29297a3ee227741dfc20994010a916c276edbf0111eafd09ada41c00e72a004.jpg" alt="Portada de Supergirl">
        <span class="movie-title">Supergirl</span>
      </button>
      <button class="movie-card" type="button" data-video="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/toystory5.mp4" aria-label="Reproducir Toy Story 5">
        <img class="movie-poster" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3VeRuSQ8TnnvpJ0rcyGZgiGCHVT57zdATbZK8TGmHUj6dgWbaQyBZVSue&s=10" alt="Portada de Toy Story 5">
        <span class="movie-title">Toy Story 5</span>
      </button>
      <button class="movie-card" type="button" data-video="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/starwars.mp4" aria-label="Reproducir Star Wars: The Mandalorian">
        <img class="movie-poster" src="https://m.media-amazon.com/images/S/pv-target-images/19e875eafcb90eb56d6decfe9258d1e3ef264bce9265535b02b169ff7452db26.jpg" alt="Portada de Star Wars: The Mandalorian">
        <span class="movie-title">Star Wars: The Mandalorian</span>
      </button>
      <button class="movie-card" type="button" aria-label="Mortal Kombat II, enlace pendiente">
        <img class="movie-poster" src="https://m.media-amazon.com/images/S/pv-target-images/7a18a299b841c018dac08104cba0ac3e20299c08bcabb0c31fa2f5b39d3d0771.jpg" alt="Portada de Mortal Kombat II">
        <span class="movie-title">Mortal Kombat II</span>
      </button>
    </div>
  </div>

  <video id="movie" controls playsinline preload="metadata" hidden>
    <source src="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video HTML5.
  </video>

  <script>
    const movie = document.getElementById('movie');
    const startScreen = document.getElementById('startScreen');
    const movieCards = document.querySelectorAll('.movie-card');
    let lastTap = 0;

    function enableAudio() {
      movie.muted = false;
      movie.volume = 1;
    }

    function enterFullscreen() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || movie.webkitDisplayingFullscreen;
      if (isFullscreen) {
        return;
      }

      if (movie.requestFullscreen) {
        movie.requestFullscreen();
      } else if (movie.webkitEnterFullscreen) {
        movie.webkitEnterFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (movie.webkitDisplayingFullscreen && movie.webkitExitFullscreen) {
        movie.webkitExitFullscreen();
      }
    }

    function playMovie(videoUrl) {
      enableAudio();
      movie.src = videoUrl;
      movie.hidden = false;
      startScreen.hidden = true;
      movie.load();
      movie.play().catch(() => {
        exitFullscreen();
        movie.hidden = true;
        startScreen.hidden = false;
      });
      enterFullscreen();
    }

    movie.addEventListener('error', () => {
      exitFullscreen();
      movie.hidden = true;
      startScreen.hidden = false;
    });

    movieCards.forEach((card) => {
      card.addEventListener('click', () => {
        if (!card.dataset.video) {
          return;
        }
        playMovie(card.dataset.video);
      });
    });

    movie.addEventListener('dblclick', enterFullscreen);
    movie.addEventListener('pointerup', enableAudio, { once: true });
    movie.addEventListener('click', enableAudio, { once: true });
    movie.addEventListener('pointerup', (event) => {
      if (event.pointerType === 'touch') {
        const now = Date.now();
        if (now - lastTap < 350) {
          enterFullscreen();
        }
        lastTap = now;
      }
    });
  </script>
</body>
</html>
