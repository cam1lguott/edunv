<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor de película</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      background: #000;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .start-message {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      font-family: "Cinzel", Georgia, serif;
      font-size: clamp(18px, 4vw, 32px);
      font-weight: 600;
      letter-spacing: 1px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
      animation: cinemaHint 2s ease forwards;
    }

    @keyframes cinemaHint {
      0% { opacity: 0; }
      20% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; }
    }

  </style>
</head>
<body>
  <div class="start-message">
    Presiona dos veces para pantalla completa
  </div>

  <video id="movie" controls autoplay playsinline preload="metadata">
    <source src="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video HTML5.
  </video>

  <script>
    const movie = document.getElementById('movie');
    let lastTap = 0;

    function enterFullscreen() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || movie.webkitDisplayingFullscreen;
      if (isFullscreen) {
        return;
      }

      if (movie.requestFullscreen) {
        movie.requestFullscreen();
      } else if (movie.webkitEnterFullscreen) {
        movie.webkitEnterFullscreen();
      }
    }

    movie.addEventListener('dblclick', enterFullscreen);
    movie.addEventListener('pointerup', (event) => {
      if (event.pointerType === 'touch') {
        const now = Date.now();
        if (now - lastTap < 350) {
          enterFullscreen();
        }
        lastTap = now;
      }
    });
  </script>
</body>
</html>
