<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor de película</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      background: #000;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at center, #101c3d 0%, #070b18 48%, #020308 100%);
    }

    .start-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: min(100%, 520px);
      text-align: center;
    }

    .movie-logo {
      display: block;
      width: min(86vw, 520px);
      max-height: 42vh;
      object-fit: contain;
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.65));
    }

    #startButton {
      border: 1px solid #e31b23;
      border-radius: 30px;
      padding: 13px 28px;
      color: #ff4a52;
      background: rgba(0, 0, 0, 0.24);
      font: 600 clamp(14px, 3.2vw, 18px) Georgia, "Times New Roman", serif;
      letter-spacing: 0.8px;
      line-height: 1.3;
      text-align: center;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(227, 27, 35, 0.22);
      transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    #startButton:hover {
      color: #fff;
      background: #b5121b;
      box-shadow: 0 0 24px rgba(227, 27, 35, 0.45);
    }

    #startButton:active {
      transform: scale(0.98);
    }

    .start-screen[hidden] {
      display: none;
    }

    video[hidden] {
      display: none;
    }

  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <div class="start-content">
      <img
        class="movie-logo"
        src="https://image.tmdb.org/t/p/original/rnavfVc4txcNYI8SE6UrQaHi7fV.png"
        alt="Spider-Man: Un Nuevo Día">
      <button id="startButton" type="button">Comenzar película</button>
    </div>
  </div>

  <video id="movie" controls playsinline preload="metadata" hidden>
    <source src="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video HTML5.
  </video>

  <script>
    const movie = document.getElementById('movie');
    const startScreen = document.getElementById('startScreen');
    const startButton = document.getElementById('startButton');
    let lastTap = 0;

    function enableAudio() {
      movie.muted = false;
      movie.volume = 1;
    }

    function enterFullscreen() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || movie.webkitDisplayingFullscreen;
      if (isFullscreen) {
        return;
      }

      if (movie.requestFullscreen) {
        movie.requestFullscreen();
      } else if (movie.webkitEnterFullscreen) {
        movie.webkitEnterFullscreen();
      }
    }

    startButton.addEventListener('click', () => {
      enableAudio();
      movie.hidden = false;
      movie.play();
      startScreen.hidden = true;
      enterFullscreen();
    });

    movie.addEventListener('dblclick', enterFullscreen);
    movie.addEventListener('pointerup', enableAudio, { once: true });
    movie.addEventListener('click', enableAudio, { once: true });
    movie.addEventListener('pointerup', (event) => {
      if (event.pointerType === 'touch') {
        const now = Date.now();
        if (now - lastTap < 350) {
          enterFullscreen();
        }
        lastTap = now;
      }
    });
  </script>
</body>
</html>
