<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor de película</title>
  <style>
    :root {
      background: #000;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    #soundButton {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      font: 600 16px system-ui, sans-serif;
      cursor: pointer;
    }

    #soundButton[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <video id="movie" controls playsinline preload="metadata">
    <source src="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mkv" type="video/x-matroska">
    Tu navegador no soporta la reproducción de video HTML5.
  </video>
  <button id="soundButton" type="button">Activar sonido</button>

  <script>
    const movie = document.getElementById('movie');
    const soundButton = document.getElementById('soundButton');

    function enableSound() {
      movie.muted = false;
      movie.volume = 1;
      soundButton.hidden = true;
    }

    soundButton.addEventListener('click', enableSound);
    movie.addEventListener('play', enableSound);
    movie.addEventListener('click', enableSound);
  </script>
</body>
</html>
