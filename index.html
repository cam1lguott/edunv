<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reproductor de película</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      background: #000;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }

    .start-screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 32px 20px 48px;
      background: linear-gradient(transparent 35%, rgba(0, 0, 0, 0.9));
    }

    #startButton {
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 4px;
      padding: 16px 24px;
      color: #fff;
      background: rgba(12, 12, 12, 0.88);
      font: 600 clamp(15px, 3.5vw, 22px) "Cinzel", Georgia, serif;
      letter-spacing: 0.5px;
      line-height: 1.3;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    }

    #startButton:active {
      transform: scale(0.98);
    }

    .start-screen[hidden] {
      display: none;
    }

  </style>
</head>
<body>
  <div class="start-screen" id="startScreen">
    <button id="startButton" type="button">
      Comenzar Spider-Man: Un Nuevo Día
    </button>
  </div>

  <video id="movie" controls playsinline preload="metadata">
    <source src="https://pub-9e78b582ad5f47edadd7b3118bd5eda3.r2.dev/Spider.Man.Dual-Lat.mp4" type="video/mp4">
    Tu navegador no soporta la reproducción de video HTML5.
  </video>

  <script>
    const movie = document.getElementById('movie');
    const startScreen = document.getElementById('startScreen');
    const startButton = document.getElementById('startButton');
    let lastTap = 0;

    function enableAudio() {
      movie.muted = false;
      movie.volume = 1;
    }

    function enterFullscreen() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || movie.webkitDisplayingFullscreen;
      if (isFullscreen) {
        return;
      }

      if (movie.requestFullscreen) {
        movie.requestFullscreen();
      } else if (movie.webkitEnterFullscreen) {
        movie.webkitEnterFullscreen();
      }
    }

    startButton.addEventListener('click', () => {
      enableAudio();
      movie.play();
      startScreen.hidden = true;
      enterFullscreen();
    });

    movie.addEventListener('dblclick', enterFullscreen);
    movie.addEventListener('pointerup', enableAudio, { once: true });
    movie.addEventListener('click', enableAudio, { once: true });
    movie.addEventListener('pointerup', (event) => {
      if (event.pointerType === 'touch') {
        const now = Date.now();
        if (now - lastTap < 350) {
          enterFullscreen();
        }
        lastTap = now;
      }
    });
  </script>
</body>
</html>
